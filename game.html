<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>エリカの絵合わせ | Erika Project</title>
    <link rel="stylesheet" href="css/lib/bulma.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/images/icon.png" type="image/png">

    <link rel="icon" href="assets/images/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/images/icon.png">

    <meta property="og:type" content="website">
    <meta property="og:title" content="エリカの絵合わせ | Erika Project">
    <meta property="og:description" content="AI Artist & Album Reviewer ERIKA. エリカが好き勝手に語るチャンネルの公式サイト">
    <meta property="og:url" content="https://erika.erikakataru.com/">
    <meta property="og:image" content="https://erika.erikakataru.com/assets/images/ogp.jpg">
    <meta property="og:site_name" content="Erika Project">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@erikakataru">
    <meta name="twitter:title" content="エリカの絵合わせ | Erika Project">
    <meta name="twitter:description" content="エリカの画像を記憶するマッチングゲーム！">
    <meta name="twitter:image" content="https://erika.erikakataru.com/assets/images/ogp.jpg">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9959522790700122"
        crossorigin="anonymous"></script>
</head>

<body>
    <div id="game-app" v-cloak>
        <nav class="p-5">
            <a href="index.html" class="has-text-warning font-weight-bold">← Back to Top</a>
        </nav>

        <section class="section pt-0">
            <div class="container has-text-centered">
                <h1 class="title is-2 has-text-white mb-2">ERIKA MEMORY</h1>

                <div v-if="isLoading" class="has-text-warning my-6">
                    ギャラリーデータを読み込んでいます...
                </div>

                <div v-else>
                    <!-- ステータス表示 -->
                    <div class="box mb-5"
                        style="background: rgba(0,0,0,0.2); border: 1px solid #555; max-width: 600px; margin: 0 auto;">
                        <div class="columns is-mobile">
                            <div class="column">
                                <p class="is-size-7 has-text-grey-light">揃ったペア</p>
                                <p class="is-size-4 has-text-white">{{ matchedPairs }} / 8</p>
                            </div>
                            <div class="column">
                                <p class="is-size-7 has-text-grey-light">お手つき制限</p>
                                <p class="is-size-4" :class="mistakes >= 3 ? 'has-text-danger' : 'has-text-warning'">
                                    {{ mistakes }} / 4
                                </p>
                            </div>
                        </div>
                    </div>

                    <div v-if="gameState === 'memorize'" class="notification is-warning is-light"
                        style="max-width: 600px; margin: 0 auto 1.5rem;">
                        <strong>配置を覚えてください！ (3秒後に裏返ります)</strong>
                    </div>

                    <!-- ゲームボード (クリア時は非表示) -->
                    <div class="memory-game">
                        <div class="memory-card" v-for="(card, index) in cards" :key="card.id"
                            :class="{ 'is-flipped': card.isFlipped, 'is-matched': card.isMatched }"
                            @click="flipCard(card)">
                            <div class="card-inner">
                                <div class="card-face card-front">E</div>
                                <div class="card-face card-back">
                                    <img :src="card.url" alt="Gallery Image">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ゲームオーバー表示 -->
                    <div v-if="gameState === 'gameover'" class="notification is-danger is-light mt-5"
                        style="max-width: 600px; margin: 0 auto;">
                        <h2 class="title is-4">Game Over...</h2>
                        <p class="mb-4">お手つきが4回に達しました。</p>
                        <button class="button is-danger is-rounded" @click="initGame">
                            <strong>リトライする</strong>
                        </button>
                    </div>

                    <!-- クリア表示 ＆ 横スクロール演出 -->
                    <div v-if="gameState === 'clear'" class="mt-5">
                        <h2 class="title is-1 has-text-warning" style="text-shadow: 0 0 20px rgba(243, 156, 18, 0.8);">
                            Clear!!</h2>
                        <p class="mb-5 has-text-white">見事すべての記憶を取り戻しました！</p>

                        <!-- スライダー演出 -->
                        <div class="marquee-container mb-6">
                            <div class="marquee-track">
                                <!-- 途切れないように同じ画像を2周分レンダリング -->
                                <template v-for="loop in 2" :key="loop">
                                    <img v-for="img in uniqueImages" :key="img + loop" :src="img" class="marquee-img">
                                </template>
                            </div>
                        </div>

                        <button class="button is-warning is-rounded is-large" @click="initGame">
                            <strong>次の記憶（別の画像）に挑戦する</strong>
                        </button>
                    </div>

                    <div v-if="gameState === 'playing'" class="mt-4">
                        <button class="button is-dark is-rounded is-small" @click="initGame">
                            リセットして引き直す
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script type="module">
        import { createApp, ref, onMounted } from './js/lib/vue.esm-browser.js';

        createApp({
            setup() {
                const galleryData = ref([]);
                const uniqueImages = ref([]); // クリア演出用
                const cards = ref([]);
                const flippedCards = ref([]);
                const matchedPairs = ref(0);
                const mistakes = ref(0);
                const isLocked = ref(false);
                const isLoading = ref(true);

                // 状態管理: 'memorize' (暗記中), 'playing' (プレイ中), 'gameover' (失敗), 'clear' (成功)
                const gameState = ref('memorize');

                const fetchGallery = async () => {
                    try {
                        const res = await fetch(`assets/gallery.json?t=${new Date().getTime()}`);
                        galleryData.value = await res.json();
                        initGame();
                    } catch (e) {
                        console.error("Gallery data could not be fetched.", e);
                    } finally {
                        isLoading.value = false;
                    }
                };

                const initGame = () => {
                    matchedPairs.value = 0;
                    mistakes.value = 0;
                    flippedCards.value = [];
                    isLocked.value = true; // 暗記中はクリック不可
                    gameState.value = 'memorize';

                    let allImages = [];
                    galleryData.value.forEach(folder => {
                        folder.images.forEach(img => {
                            allImages.push(`assets/images/gallery/${folder.name}/${img.file}`);
                        });
                    });

                    // 8枚ランダム抽出して保存
                    const selectedImages = allImages.sort(() => 0.5 - Math.random()).slice(0, 8);
                    uniqueImages.value = selectedImages;

                    let deck = [];
                    selectedImages.forEach((url, index) => {
                        deck.push({ id: `${index}a`, pairId: index, url: url, isFlipped: true, isMatched: false });
                        deck.push({ id: `${index}b`, pairId: index, url: url, isFlipped: true, isMatched: false });
                    });

                    // シャッフルして初期配置（すべて表向き）
                    cards.value = deck.sort(() => 0.5 - Math.random());

                    // 3秒後にすべて裏返してゲームスタート
                    setTimeout(() => {
                        cards.value.forEach(card => card.isFlipped = false);
                        gameState.value = 'playing';
                        isLocked.value = false;
                    }, 3000);
                };

                const flipCard = (card) => {
                    if (isLocked.value || card.isFlipped || card.isMatched || gameState.value !== 'playing') return;

                    card.isFlipped = true;
                    flippedCards.value.push(card);

                    if (flippedCards.value.length === 2) {
                        checkMatch();
                    }
                };

                const checkMatch = () => {
                    isLocked.value = true;
                    const [card1, card2] = flippedCards.value;

                    if (card1.pairId === card2.pairId) {
                        card1.isMatched = true;
                        card2.isMatched = true;
                        matchedPairs.value++;
                        flippedCards.value = [];

                        if (matchedPairs.value === 8) {
                            setTimeout(() => { gameState.value = 'clear'; }, 500);
                        } else {
                            isLocked.value = false;
                        }
                    } else {
                        // お手つき処理
                        mistakes.value++;
                        if (mistakes.value >= 4) {
                            setTimeout(() => { gameState.value = 'gameover'; }, 800);
                        } else {
                            setTimeout(() => {
                                card1.isFlipped = false;
                                card2.isFlipped = false;
                                flippedCards.value = [];
                                isLocked.value = false;
                            }, 1000);
                        }
                    }
                };

                onMounted(fetchGallery);

                return {
                    cards, matchedPairs, mistakes, gameState, isLoading, uniqueImages,
                    flipCard, initGame
                };
            }
        }).mount('#game-app');
    </script>
</body>

</html>
