name: エリカの自動日報生成

# 実行されるタイミングの設定
on:
  schedule:
    # 毎日日本時間の朝7:00（UTCの22:00）に自動実行
    - cron: '0 22 * * *'
  workflow_dispatch:
    # GitHubの画面から手動で実行するためのボタンも有効化

# ▼▼▼ この2行を追加 ▼▼▼
permissions:
  contents: write
# ▲▲▲ 追加ここまで ▲▲▲

jobs:
  generate-report:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1. リポジトリのコードを読み込む
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Pythonの環境を準備する
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 安定しているバージョンを指定

      # 3. 必要なライブラリをインストールする
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk  # ←この1行を一番上に追加
          python -m pip install --upgrade pip
          pip install openai feedparser requests google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client google-genai tavily-python

      # 4. エリカに日報を書かせる（Pythonスクリプトの実行）
      - name: Run report generation script
        env:
          SAKURA_API_KEY: ${{ secrets.SAKURA_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }} 
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }} 
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python report_gen.py --mode private

     # 5. 生成されたファイル（MarkdownとJSON、そして音声）をGitHubに自動保存
      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # report_gen.py の出力先はすべて public/ 配下
          #   public/reports/        : 日報(.md) と YouTube ID(.txt)
          #   public/assets/*.json   : 日報一覧 (reports.json / public_reports.json)
          #   public/assets/images/  : アイキャッチ画像
          # 音声・動画(public/assets/audio/)は YouTube 投稿後に削除される一時ファイルなのでコミットしない
          git add public/reports/ public/assets/reports.json public/assets/public_reports.json public/assets/images/

          if git diff --staged --quiet; then
            echo "変更はありません"
            exit 0
          fi

          git commit -m "エリカが本日の日報を自動生成しました 📝"
          # 実行中に別のワークフローが push していても失敗しないよう、最新を取り込んでから push
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push