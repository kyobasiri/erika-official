name: Generate JSON and Deploy

on:
  push:
    branches:
      - main # mainブランチにPushされたら常に実行するように変更
  workflow_dispatch:

permissions:
  contents: write
  deployments: write # デプロイ処理のために追加

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- 1. PythonでJSON生成（既存の処理） ---
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          python -m pip install --upgrade pip
          pip install google-cloud-vision openai python-dotenv

      - name: Generate JSON
        env:
          SAKURA_API_KEY: ${{ secrets.SAKURA_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }} 
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }} 
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TASKS_TOKEN: ${{ secrets.TASKS_TOKEN }}
          GCP_VISION_CREDENTIALS_TOKEN: ${{ secrets.GCP_VISION_CREDENTIALS }}
        run: python gallery_gen.py

      # --- 2. 生成されたJSONをGitHubに保存（既存の処理） ---
      - name: Commit and Push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/assets/gallery.json public/assets/articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-generate json data" && git push)

      # --- 3. Viteビルド（ここから追加） ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Vite App
        run: npm run build

      # --- 4. Cloudflare Pagesへデプロイ ---
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'erika-official' # Cloudflare上のプロジェクト名に合わせる
          directory: 'dist'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}