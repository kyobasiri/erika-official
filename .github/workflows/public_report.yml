name: エリカの公開用ニュース自動生成 (Public)

# 実行されるタイミングの設定
on:
  workflow_dispatch:
    # GitHubの画面から手動で実行するためのボタン

# ▼▼▼ この2行を追加 ▼▼▼
permissions:
  contents: write
# ▲▲▲ 追加ここまで ▲▲▲

jobs:
  generate-public-report:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1. リポジトリのコードを読み込む
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Pythonの環境を準備する
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 安定しているバージョンを指定

      # 3. 必要なライブラリをインストールする
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk  # ←この1行を一番上に追加
          python -m pip install --upgrade pip
          pip install openai feedparser requests google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client google-genai tavily-python

      # 4. エリカに公開用日報を書かせる（--mode public を指定）
      - name: Run report generation script (Public Mode)
        env:
          SAKURA_API_KEY: ${{ secrets.SAKURA_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }} 
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }} 
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python report_gen.py --mode public

      # 5. 生成されたファイルだけを GitHub に保存する
      #    `git add .` だと、途中で失敗して残った音声・動画（public/assets/audio/ の wav・mp4・srt）や
      #    __pycache__ まで commit されてしまう。Cloudflare Pages は1ファイル25MiBまでなので、
      #    大きな mp4 が入るとデプロイが失敗する。そのため、追加するパスを明示する。
      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # report_gen.py の出力先
          #   public/reports/        : 日報(.md) と YouTube ID(.txt)
          #   public/assets/*.json   : 日報一覧 (reports.json / public_reports.json)
          #   public/assets/images/  : アイキャッチ画像
          # 音声・動画(public/assets/audio/)は YouTube 投稿後に削除される一時ファイルなのでコミットしない
          git add public/reports/ public/assets/reports.json public/assets/public_reports.json public/assets/images/

          if git diff --staged --quiet; then
            echo "変更はありません"
            exit 0
          fi

          git commit -m "エリカが本日のパブリック用日報と音声を自動生成しました"
          # 実行中に別のワークフローが push していても失敗しないよう、最新を取り込んでから push
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
