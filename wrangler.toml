#:schema node_modules/wrangler/config-schema.json
name = "erika-official"
pages_build_output_dir = "dist"
compatibility_date = "2026-02-01"

[ai]
binding = "AI"

# ここがKVの設定です（JSONの配列 [[ ]] を TOMLのテーブル形式にします）
[[kv_namespaces]]
binding = "KV_BINDING" # プログラム内で使用する名前
id = "8bd96d4e26724747a6204d8d01d7d689"

# 3. R2 のバインディング
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "erika-rpg-assets"

# 4. 好きな言葉（/words）の管理ページ用
#    手順は docs/words-admin-setup.md を参照。
#    D1 を作成したら、下のコメント（#）を外して database_id とログイン設定を入れてください。
#    （存在しない ID のままだとデプロイが失敗するので、作成前はコメントのままにしておきます）
[[d1_databases]]
binding = "DB"
database_name = "erika-words"
database_id = "75249b05-6d1a-4075-bd65-e1022a337157"
migrations_dir = "migrations"

[vars]
ACCESS_TEAM_DOMAIN = "erikakataru.cloudflareaccess.com"
ACCESS_AUD = "bb0f4fc89087542fb8e16ffe96044a7302300a8921fde0ea1e0b2071501c22c9"
ADMIN_EMAILS = "kyobasiri@gmail.com"